name: Universal Engineering Harness CI/CD

on:
  push:
    branches: [main, master, Branch1]
  pull_request:
    branches: [main, master, Branch1]
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/cms_db' }}

jobs:
  harness-quality-gates:
    name: ⚡ Universal Harness 6 Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Gate 1 & 2 - Structure & TypeScript Strict Check
        run: |
          python3 .harness/scripts/verify-harness.py
          pnpm typecheck

      - name: Gate 3 - ESLint Cleanliness
        run: pnpm lint

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: Frontend Checks & Verification
        run: |
          cd frontend && pnpm build

      - name: Gate 4 & 5 - TDD Ratio & 100% Unit Test Coverage Gate (M-COV)
        run: |
          cd backend && pnpm test:coverage
          python3 ../.harness/sensors/m-cov.py coverage/cobertura-coverage.xml
          python3 ../.harness/sensors/m-tdd.py src

      - name: Gate 6 - Hexagonal Architecture Verification (M-HEX)
        run: |
          cd backend && npx depcruise --output-type json src > ../depcruise-report.json
          python3 ../.harness/sensors/m-hex.py depcruise-report.json

  # ====================================================
  # G-05: Build & Push Docker Image to GHCR
  # ====================================================
  build-and-push:
    name: 🐳 G-05: Build & Push Docker Image
    needs: harness-quality-gates
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Branch1'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: string
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.string.outputs.REPO_LC }}/cms-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ====================================================
  # G-06: Deploy to Railway (Staging)
  # ====================================================
  deploy-staging:
    name: 🚀 G-06: Deploy to Railway (Staging)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Branch1'
    environment: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
        run: |
          railway up --service cms-backend --detach || railway up --detach

  # ====================================================
  # G-07: Production Deploy (Manual Approve)
  # ====================================================
  deploy-production:
    name: 🛡️ G-07: Production Deploy (Manual Approve)
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Branch1'
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
        run: |
          railway up --service cms-backend-prod --detach || railway up --detach
